[project]
name = "selene-match"
version = "0.1.0"
description = "Multi-modal, sun-angle and scale-invariant lunar image correspondence (SIH 2026, PS 26166)"
requires-python = ">=3.11"
license = { text = "MIT" }

[project.scripts]
selene = "selene.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
